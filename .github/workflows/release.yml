name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: '0.13.0'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev \
          wayland-dev \
          wayland-protocols
    
    - name: Build for ${{ matrix.target }}
      run: |
        zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast
        
        # Create release directory
        mkdir -p release/${{ matrix.target }}
        
        # Copy binary and essential files
        cp zig-out/bin/hyprmcp release/${{ matrix.target }}/
        cp README.md LICENSE release/${{ matrix.target }}/
        
        # Create tarball
        cd release
        tar -czf hyprmcp-${{ matrix.target }}.tar.gz ${{ matrix.target }}/
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: hyprmcp-${{ matrix.target }}
        path: release/hyprmcp-${{ matrix.target }}.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate changelog
      id: changelog
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
        # Generate changelog (you might want to use a tool like github-changelog-generator)
        echo "## Changes in $VERSION" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "See the full changelog at: https://github.com/conneroisu/hyprmcp/compare/$(git describe --tags --abbrev=0 HEAD^)...$VERSION" >> CHANGELOG.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: HyprMCP ${{ steps.changelog.outputs.version }}
        body_path: CHANGELOG.md
        files: |
          hyprmcp-x86_64-linux/hyprmcp-x86_64-linux.tar.gz
          hyprmcp-aarch64-linux/hyprmcp-aarch64-linux.tar.gz
        prerelease: ${{ contains(github.ref, '-') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    name: Publish Documentation
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: '0.13.0'
    
    - name: Generate API docs
      run: zig build docs
    
    - name: Setup mdBook
      uses: peaceiris/actions-mdbook@v2
      with:
        mdbook-version: 'latest'
    
    - name: Build documentation
      run: |
        cd docs
        mdbook build
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/book
        cname: hyprmcp.dev  # Optional: custom domain